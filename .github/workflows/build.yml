name: build-golazo

# Reproducible (verifiable) build on a Linux runner using the pinned image with
# Rust >= 1.85 — this is the guide's fix for the `edition2024` / blake3 error
# that plain Solana 2.1 platform-tools (Rust 1.79) hits.
#
# Outputs (download from the run's Artifacts):
#   - golazo.so            (the program binary, deploy this)
#   - golazo-keypair.json  (one-time program keypair = sets the program address;
#                           NOT the upgrade key. Upgrade authority = treasury.)
#   - PROGRAM_ID.txt       (the program address)
#
# The repo root IS the anchor project (Anchor.toml at root).

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (host, for cargo install)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.12/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      - name: Generate program keypair and sync declare_id
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase -s -o target/deploy/golazo-keypair.json
          PID="$(solana address -k target/deploy/golazo-keypair.json)"
          echo "PROGRAM ID = $PID"
          echo "$PID" > PROGRAM_ID.txt
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$PID\")/" programs/golazo/src/lib.rs
          sed -i "s/^golazo = \"[^\"]*\"/golazo = \"$PID\"/" Anchor.toml
          echo "--- declare_id now ---"; grep declare_id programs/golazo/src/lib.rs
          echo "--- Anchor.toml now ---"; grep "golazo =" Anchor.toml

      - name: Ensure Cargo.lock (pitfall #7)
        run: cargo generate-lockfile || true

      - name: Verifiable build (Rust 1.85 image — fixes edition2024)
        run: solana-verify build --library-name golazo --base-image solanafoundation/solana-verifiable-build:3.1.14

      - name: Locate built .so
        run: |
          ls -la target/deploy/ || true
          test -f target/deploy/golazo.so && echo "golazo.so OK ($(stat -c%s target/deploy/golazo.so) bytes)" || (echo "golazo.so MISSING"; find . -name 'golazo.so' -not -path '*/node_modules/*'; exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golazo-program
          path: |
            target/deploy/golazo.so
            target/deploy/golazo-keypair.json
            PROGRAM_ID.txt
          if-no-files-found: error
