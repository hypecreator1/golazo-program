name: build-golazo

# Builds the Anchor program on a Linux runner and uploads golazo.so as an
# artifact you can download and deploy from Windows PowerShell.
#
# NOTE: the repo root IS the anchor project (Anchor.toml at root), so all
# build steps run from the repository root (no working-directory).

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (cargo, pinned 0.31.1)
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked --force

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: Ensure Cargo.lock (pitfall #7)
        run: cargo generate-lockfile || true

      - name: Anchor build
        run: anchor build

      - name: Show program id baked in keypair
        run: solana address -k target/deploy/golazo-keypair.json || true

      - name: Upload .so + idl
        uses: actions/upload-artifact@v4
        with:
          name: golazo-program
          path: |
            target/deploy/golazo.so
            target/idl/golazo.json
          if-no-files-found: error
