name: build-golazo

# Verifiable build on a Linux runner with the pinned image (Rust >= 1.85).
#
# declare_id is now FIXED in source to the deployed program id
# (8o9XyJy6jvPfSmABmVdHyenjBFx83tTbgWziz8QMS3BC) — we do NOT generate a random
# keypair anymore. This run is a REPRODUCIBILITY PRE-CHECK: it builds the program
# and prints the executable hash so we can compare it to the deployed binary
# hash BEFORE spending any SOL on verification.
#
# Expected deployed executable hash (sha256, trailing zeros stripped):
#   1afd02ab38074395e0f514ac1124ded5ba87fae25221308fe290d75abe12ac2e
#
# Outputs (download from the run's Artifacts):
#   - golazo.so   (freshly built binary)
#   - Cargo.lock  (the exact dependency lock used — commit this to pin the build)
#
# The repo root IS the anchor project (Anchor.toml at root).

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  EXPECTED_HASH: 1afd02ab38074395e0f514ac1124ded5ba87fae25221308fe290d75abe12ac2e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (host, for cargo install)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.12/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      - name: Confirm declare_id is the deployed id
        run: |
          echo "--- declare_id in source ---"; grep declare_id programs/golazo/src/lib.rs
          echo "--- Anchor.toml ---"; grep "golazo =" Anchor.toml
          grep -q '8o9XyJy6jvPfSmABmVdHyenjBFx83tTbgWziz8QMS3BC' programs/golazo/src/lib.rs \
            || (echo "declare_id is NOT the deployed id"; exit 1)

      - name: Generate Cargo.lock (pin deps — pitfall #7)
        run: |
          cargo generate-lockfile
          echo "--- key locked versions ---"
          grep -A1 'name = "anchor-lang"' Cargo.lock | head -4 || true
          grep -A1 'name = "anchor-spl"'  Cargo.lock | head -4 || true
          grep -A1 'name = "solana-program"' Cargo.lock | head -4 || true

      - name: Verifiable build (Rust 1.85 image — fixes edition2024)
        run: solana-verify build --library-name golazo --base-image solanafoundation/solana-verifiable-build:3.1.14

      - name: Locate built .so
        run: |
          ls -la target/deploy/ || true
          test -f target/deploy/golazo.so && echo "golazo.so OK ($(stat -c%s target/deploy/golazo.so) bytes)" || (echo "golazo.so MISSING"; find . -name 'golazo.so' -not -path '*/node_modules/*'; exit 1)

      - name: Compute executable hash and compare to deployed
        run: |
          HASH="$(solana-verify get-executable-hash target/deploy/golazo.so)"
          echo "built executable hash : $HASH"
          echo "deployed expected hash: $EXPECTED_HASH"
          if [ "$HASH" = "$EXPECTED_HASH" ]; then
            echo "::notice::HASH MATCH ✅ — repo reproduces the deployed binary. Safe to verify-from-repo."
            echo "MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::HASH MISMATCH ❌ — deployed binary not reproducible from this repo state (likely Cargo.lock deps drifted). Will need an upgrade-to-verified-binary instead."
            echo "MATCH=false" >> "$GITHUB_ENV"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golazo-verify
          path: |
            target/deploy/golazo.so
            Cargo.lock
          if-no-files-found: error
